title: PR Triage
description: Reads the code behind every new pull request on GitHub and sorts it
remote_theme: just-the-docs/just-the-docs

# Project sites live at <user>.github.io/<repo>, so Jekyll needs the repo name or
# every stylesheet and link resolves against the wrong root and 404s.
url: https://pablogd-hashi.github.io
baseurl: /rp-ghtriage

# just-the-docs renders ```mermaid fences natively once a version is pinned.
# Without this the diagrams in architecture.md come out as plain code blocks.
mermaid:
  version: "10.9.1"

aux_links:
  GitHub repository:
    - https://github.com/pablogd-hashi/rp-ghtriage
aux_links_new_tab: true

heading_anchors: true
search_enabled: true

# Custom scheme in _sass/color_schemes/redpanda.scss.
color_scheme: redpanda

# Defence in depth. These four are gitignored, so they never reach the remote and
# Pages never sees them. If that ever slips, the site still will not publish them.
exclude:
  - eli5.md
  - seam-map.md
  - demo-runbook.md
  - study-guide.md
